<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Выбор игры</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0d0e15;--card:#161925;--line:#2b3046;--text:#ece6d8;--dim:#9591a8;--amber:#f2b65c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
main{max-width:480px;margin:0 auto;padding:22px 16px calc(24px + env(safe-area-inset-bottom))}
h1{margin:0;font:700 26px Georgia,"Times New Roman",serif;letter-spacing:.5px}
.hello{color:var(--dim);margin:4px 0 20px}
.game{display:block;width:100%;text-align:left;color:inherit;font:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px;padding:0;cursor:pointer;touch-action:manipulation}
.game:active{transform:scale(.99);filter:brightness(1.1)}
.art{height:132px;position:relative;overflow:hidden}
.art canvas{position:absolute;inset:0;width:100%;height:100%}
.art pre{margin:0;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:13px/1.15 ui-monospace,"Cascadia Mono",Consolas,monospace;color:#d8c89a;background:#0e1016}
.info{padding:12px 14px 14px}
.info b{font-size:17px}
.info p{margin:3px 0 0;color:var(--dim);font-size:13px}
.prog{margin-top:8px;font-size:12.5px;color:var(--amber)}
.tag{float:right;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin-top:3px}
</style>
</head>
<body>
<main>
  <h1>Выбор игры</h1>
  <div class="hello" id="hello">Во что сыграем сегодня?</div>

  <button class="game" data-href="index.html">
    <div class="art"><pre>
    ^      ^^        ^
   /|\_   /  \   .  /|\
  _ |_ __/    \_ . _/ \__
 ~~ . ~~ ~ . ~~ ~~ . ~~ ~</pre></div>
    <div class="info"><span class="tag">ASCII-RPG</span><b>Пыльная Тропа</b>
      <p>Герой сам идёт и сражается, а ты собираешь снаряжение, крафтишь и настраиваешь тактику.</p>
      <div class="prog" id="pTrail"></div></div>
  </button>

  <button class="game" data-href="novel.html">
    <div class="art"><canvas id="novelArt"></canvas></div>
    <div class="info"><span class="tag">нуар-новелла</span><b>Домовой</b>
      <p>Ты — искусственный интеллект многоэтажки. Через семь дней тебя отключат. А в доме есть дверь, которую ты никогда не видел.</p>
      <div class="prog" id="pNovel"></div></div>
  </button>
</main>
<script>
'use strict';
const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData ? Telegram.WebApp : null;
const cloud = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') ? tg.CloudStorage : null;
const TRAIL_KEY = 'dust-trail-save-v1', NOVEL_KEY = 'domovoy-v1';

if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#0d0e15'); tg.setBackgroundColor('#0d0e15'); } catch (e) {}
  try { tg.BackButton.hide(); } catch (e) {}
  const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u && u.first_name) document.getElementById('hello').textContent = `${u.first_name}, во что сыграем сегодня?`;
}

// в игру передаём эпоху сброса и данные Telegram, плюс метку, что пришли из хаба (для кнопки «Назад»)
document.querySelectorAll('.game').forEach(b => b.onclick = () => {
  try { tg && tg.HapticFeedback.selectionChanged(); } catch (e) {}
  const q = new URLSearchParams(location.search); q.set('hub', '1');
  location.href = b.dataset.href + '?' + q.toString() + location.hash;
});

// прогресс в обеих играх
function showProgress(trail, novel) {
  if (trail && trail.lvl) document.getElementById('pTrail').textContent = `Уровень героя ${trail.lvl}` + (trail.rebirths ? ` · перерождений: ${trail.rebirths}` : '');
  if (novel) {
    const done = Object.keys(novel.done || {}).length;
    const txt = done ? `Пройдено эпизодов: ${done}` : novel.cur ? `Эпизод ${novel.cur.ep} в процессе` : '';
    if (txt) document.getElementById('pNovel').textContent = txt;
  }
}
const parse = s => { try { return s ? JSON.parse(s) : null; } catch (e) { return null; } };
const local = k => { try { return parse(localStorage.getItem(k)); } catch (e) { return null; } };
showProgress(local(TRAIL_KEY), local(NOVEL_KEY));
if (cloud) cloud.getItems([TRAIL_KEY, NOVEL_KEY], (err, v) => { if (!err && v) showProgress(parse(v[TRAIL_KEY]) || local(TRAIL_KEY), parse(v[NOVEL_KEY]) || local(NOVEL_KEY)); });

// заставка «Домового»: ночная многоэтажка глазами камеры наблюдения
const cv = document.getElementById('novelArt'), c = cv.getContext('2d');
let w = 0, h = 0;
function size() { const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); w = r.width; h = r.height; cv.width = w * d; cv.height = h * d; c.setTransform(d, 0, 0, d, 0, 0); }
new ResizeObserver(size).observe(cv); size();
const flakes = Array.from({ length: 60 }, () => ({ x: Math.random(), y: Math.random(), s: .5 + Math.random() * 1.6, v: .03 + Math.random() * .05 }));
const lit = Array.from({ length: 200 }, () => Math.random());
function draw(t) {
  t /= 1000;
  c.fillStyle = '#0b0d1e'; c.fillRect(0, 0, w, h);
  c.fillStyle = '#141230'; c.fillRect(0, 0, w, h * .55);
  // соседние дома
  for (let i = 0; i < 6; i++) { c.fillStyle = '#121428'; c.fillRect(i * w / 5 - 20, h * (.35 + (i % 2) * .1), w / 6, h); }
  // «Рассвет»
  const bx = w / 2 - 70, by = h * .3, bw = 140;
  c.fillStyle = '#1c1e30'; c.fillRect(bx, by, bw, h); c.fillStyle = '#12142a'; c.fillRect(bx + bw * .66, by, bw * .34, h);
  let k = 0;
  for (let y = by + 10; y < h; y += 11) for (let x = bx + 8; x < bx + bw - 8; x += 16) {
    const v = lit[k++ % lit.length], on = v < .3 || (v < .34 && Math.sin(t * 2 + v * 50) > 0);
    c.fillStyle = on ? (v < .2 ? '#f2c66a' : '#7ac8ff') : '#151828'; c.fillRect(x, y, 8, 5);
  }
  // окно квартиры 66, которое горит не так, как остальные
  c.fillStyle = `rgba(78,242,255,${.5 + Math.sin(t * 3) * .3})`; c.fillRect(bx + 56, by + 10 + 11 * 6, 8, 5);
  c.strokeStyle = '#4ef2ff'; c.lineWidth = 2; c.strokeRect(bx + 20, by - 18, 100, 14);
  c.fillStyle = '#4ef2ff'; c.font = '700 9px system-ui,sans-serif'; c.textAlign = 'center'; c.fillText('ЖК РАССВЕТ', bx + 70, by - 8);
  // снег
  c.fillStyle = 'rgba(230,236,250,.8)';
  for (const f of flakes) { f.y = (f.y + f.v / 60) % 1; c.beginPath(); c.arc(((f.x + Math.sin(t + f.y * 9) * .01) % 1) * w, f.y * h, f.s, 0, 7); c.fill(); }
  // полосы и метки камеры
  for (let y = 0; y < h; y += 3) { c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(0, y, w, 1); }
  c.textAlign = 'left'; c.font = '600 11px ui-monospace,Consolas,monospace';
  if (Math.floor(t * 1.6) % 2) { c.fillStyle = '#ff4a5a'; c.beginPath(); c.arc(14, 14, 4, 0, 7); c.fill(); }
  c.fillStyle = '#e8f6ff'; c.fillText('REC  КАМ 0-00 · ДВОР', 24, 18);
  c.textAlign = 'right'; c.fillText('03:12', w - 10, 18);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
