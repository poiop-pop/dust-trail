<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Домовой</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#07080c;--ink:#0a0a12;--text:#e9e6df;--dim:#9a98a8;--cyan:#4ef2ff;--pink:#ff5ab4;--amber:#f2b65c;--red:#ff4a5a;--panel:rgba(9,10,16,.92);--line:#2a3040}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:var(--text);background:#141824;border:1px solid var(--line);border-radius:4px;cursor:pointer;touch-action:manipulation}
button:active{filter:brightness(1.3)}
.hidden{display:none!important}
#stage{position:fixed;inset:0;overflow:hidden;max-width:620px;margin:0 auto;background:#000}
#bg,#bg2{position:absolute;inset:0;transition:opacity .6s}
#bg svg,#bg2 svg{width:100%;height:100%;display:block}
#weather{position:absolute;inset:0;pointer-events:none}
#char{position:absolute;left:0;right:0;bottom:0;height:80%;pointer-events:none;transition:opacity .35s,transform .35s}
#char svg{position:absolute;left:50%;bottom:0;height:100%;transform:translateX(-50%);max-width:none}
#char.off{opacity:0;transform:translateY(14px)}
#char.dim{filter:brightness(.55) saturate(.7)}
.holo{animation:holo 3s infinite steps(1)}
@keyframes holo{0%,100%{opacity:.92}47%{opacity:.6}48%{opacity:.95}73%{opacity:.75;transform:translateX(-49%)}74%{opacity:.92}}
.smoke{animation:smoke 4s infinite ease-in-out}
@keyframes smoke{0%{transform:translate(0,0);opacity:.55}100%{transform:translate(8px,-40px);opacity:0}}
/* наложение «камера наблюдения» */
#cctv{position:absolute;inset:0;pointer-events:none;font:600 12px ui-monospace,Consolas,monospace;color:#e8f6ff;text-shadow:0 0 4px #000}
#cctv .rec{position:absolute;left:14px;top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:6px}
#cctv .rec i{width:9px;height:9px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite steps(1)}
@keyframes blink{50%{opacity:0}}
#cctv .time{position:absolute;left:66px;top:calc(12px + env(safe-area-inset-top))}
#cctv .cam{position:absolute;left:14px;top:calc(30px + env(safe-area-inset-top));opacity:.8}
#cctv .frame{position:absolute;inset:44px 10px 10px;border:0}
#cctv .frame::before,#cctv .frame::after{content:"";position:absolute;width:22px;height:22px;border:2px solid rgba(232,246,255,.6)}
#cctv .frame::before{left:0;top:0;border-right:0;border-bottom:0}
#cctv .frame::after{right:0;top:0;border-left:0;border-bottom:0}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.09;mix-blend-mode:screen;width:100%;height:100%}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s}
.glitch #bg,.glitch #char{animation:glitch .45s steps(2) 1}
@keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-6px,2px);filter:hue-rotate(90deg) saturate(3)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,0);filter:invert(.15)}80%{transform:translate(2px,1px)}100%{transform:translate(0)}}
.shake{animation:shake .4s 1}
@keyframes shake{25%{transform:translate(4px,-2px)}50%{transform:translate(-4px,2px)}75%{transform:translate(2px,2px)}}
/* текст */
#box{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));min-height:132px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:3px;padding:16px 16px 14px;box-shadow:0 10px 40px #000c}
#name{position:absolute;left:12px;top:-14px;padding:3px 10px;font:700 13px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;background:#0a0b12;border:1px solid currentColor;border-radius:2px}
#text{font-size:16.5px;line-height:1.55;min-height:3em;white-space:pre-wrap}
#text.thought{font-style:italic;color:#cfd8e6}
#next{position:absolute;right:12px;bottom:6px;color:var(--cyan);font-size:12px;animation:blink 1s infinite steps(1)}
#choices{position:absolute;left:14px;right:14px;bottom:calc(158px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#choices button{text-align:left;padding:12px 14px;background:rgba(10,12,20,.94);border:1px solid var(--cyan);border-radius:3px;font-size:15px;box-shadow:0 0 0 1px #000,0 6px 20px #000a}
#choices button::before{content:"▸ ";color:var(--cyan)}
#top{position:absolute;right:10px;top:calc(8px + env(safe-area-inset-top));display:flex;gap:6px}
#top button{width:38px;height:34px;padding:0;background:rgba(10,12,20,.7);font-size:16px}
/* чат и терминал */
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.55);z-index:5}
.phone{width:100%;max-width:340px;background:#0f1320;border:1px solid #2c3550;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px #000}
.phone h3{margin:0;padding:10px 14px;font-size:13px;background:#171d30;color:#b8c4e8;font-weight:600}
.phone .msgs{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.bub{background:#1e2640;border-radius:10px 10px 10px 2px;padding:7px 10px;font-size:14px;max-width:88%;animation:pop .25s}
.bub b{display:block;font-size:11px;color:var(--pink);margin-bottom:2px}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.panelbox{width:100%;max-width:340px;background:#1c1e22;border:3px solid #0a0a0e;border-radius:6px;padding:16px;box-shadow:inset 0 0 0 2px #3a3d44,0 20px 60px #000}
.panelbox h3{margin:0 0 4px;font:700 14px ui-monospace,monospace;color:var(--amber);letter-spacing:.05em}
.panelbox .hint{font-size:12.5px;color:var(--dim);margin:6px 0}
.disp{display:flex;justify-content:center;gap:8px;margin:12px 0}
.disp span{width:44px;height:54px;background:#081008;border:1px solid #2a4a2a;border-radius:3px;display:flex;align-items:center;justify-content:center;font:700 28px ui-monospace,monospace;color:#7dff8a;text-shadow:0 0 8px #3aff5a}
.disp.bad span{color:var(--red);border-color:var(--red);text-shadow:0 0 8px var(--red)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys button{padding:11px 0;font:700 18px ui-monospace,monospace;background:#2a2d33;border-color:#0a0a0e}
.clues{list-style:none;padding:0;margin:6px 0 0;font-size:13px}
.clues li{padding:3px 0;color:#d8d2c0}.clues li::before{content:"◆ ";color:var(--amber)}
/* экраны */
#screen{position:absolute;inset:0;z-index:10;overflow:auto;background:linear-gradient(rgba(5,6,10,.35),rgba(5,6,10,.92) 62%)}
#screen:empty{display:none}
.wrap{min-height:100%;padding:40px 22px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:flex-end;max-width:460px;margin:0 auto}
.logo{font:800 clamp(40px,13vw,64px)/1 system-ui,sans-serif;letter-spacing:.08em;color:#f4f0e8;text-shadow:3px 0 0 var(--pink),-3px 0 0 var(--cyan),0 0 30px rgba(78,242,255,.35)}
.tag{color:var(--cyan);font:600 12px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;margin:10px 0 26px}
.menu{display:flex;flex-direction:column;gap:9px}
.menu button{padding:13px 16px;text-align:left;font-size:16px;background:rgba(12,14,22,.9)}
.menu button.pri{border-color:var(--cyan);box-shadow:inset 3px 0 0 var(--cyan)}
.note{color:var(--dim);font-size:12.5px;margin-top:16px}
.ep{padding:14px 16px;background:rgba(12,14,22,.92);border:1px solid var(--line);border-radius:4px;margin-bottom:10px}
.ep b{display:block;font-size:17px}.ep small{color:var(--dim)}
.ep.locked{opacity:.5}
.sum{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:8px}
.sum li{background:rgba(12,14,22,.9);border:1px solid var(--line);border-left:3px solid var(--cyan);padding:9px 12px;font-size:14px}
.sum li b{color:var(--cyan)}
.modal{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{width:100%;max-width:420px;max-height:84vh;overflow:auto;background:#0e1018;border:1px solid var(--line);border-radius:4px;padding:16px}
.modal h2{margin:0 0 10px;font-size:18px}
.log p{margin:0 0 10px;font-size:14px;line-height:1.45}.log p b{font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.log p.th{font-style:italic;color:#bfc6d4}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="bg2"></div>
  <canvas id="weather"></canvas>
  <div id="char" class="off"></div>
  <div id="scan"></div><div id="vign"></div><canvas id="grain" width="160" height="160"></canvas>
  <div id="cctv" class="hidden"><div class="rec"><i></i>REC</div><div class="time" id="ctime"></div><div class="cam" id="ccam"></div><div class="frame"></div></div>
  <div id="flash"></div>
  <div id="top" class="hidden"><button id="bLog" aria-label="Журнал">☰</button><button id="bMenu" aria-label="Меню">⏸</button></div>
  <div id="choices"></div>
  <div id="box" class="hidden"><div id="name" class="hidden"></div><div id="text"></div><div id="next" class="hidden">▼</div></div>
  <div id="over" class="over hidden"></div>
  <div id="screen"></div>
  <div id="modal" class="modal hidden"><div class="card" id="mcard"></div></div>
</div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <pattern id="ht" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="3.5" cy="3.5" r="1.4" fill="#000" opacity=".5"/></pattern>
    <pattern id="htw" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="4" cy="4" r="1.2" fill="#fff" opacity=".18"/></pattern>
    <pattern id="scanl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.5" fill="#fff" opacity=".18"/></pattern>
  </defs>
</svg>
<script>
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const INK = '#0a0a12';

// ====================== Персонажи (векторные портреты, cel-shading) ======================
let uid = 0;
const HEAD = 'M126,222 C124,150 163,124 200,124 C237,124 276,150 274,222 C274,272 252,312 200,336 C148,312 126,272 126,222 Z';
const BROWS = { n: [0, 0], s: [-3, -3], a: [10, -5], w: [-11, -6], m: [0, 0] };
const OPEN = { n: 1, s: .75, a: .62, w: 1.3, m: .85 };
const MOUTH = {
  n: '<path d="M183,301 Q200,304 217,301" fill="none" stroke="INK" stroke-width="4" stroke-linecap="round"/>',
  s: '<path d="M179,296 Q200,316 221,296" fill="none" stroke="INK" stroke-width="4" stroke-linecap="round"/>',
  a: '<path d="M182,307 Q200,296 218,307" fill="none" stroke="INK" stroke-width="4.5" stroke-linecap="round"/>',
  w: '<ellipse cx="200" cy="303" rx="8" ry="10" fill="#3a1018" stroke="INK" stroke-width="3.5"/>',
  m: '<path d="M182,302 Q206,306 222,293" fill="none" stroke="INK" stroke-width="4" stroke-linecap="round"/>',
};
function eyes(e, o) {
  const op = OPEN[e] || 1, out = [];
  for (const [cx, side] of [[168, -1], [232, 1]]) {
    if (side === 1 && o.cyberRight) continue;
    const id = 'e' + (++uid), cy = 232, top = cy - 13 * op, bot = cy + 7 * Math.min(op, 1);
    const eye = `M${cx - 21},${cy} Q${cx},${top - 4} ${cx + 21},${cy} Q${cx},${bot + 3} ${cx - 21},${cy}Z`;
    out.push(`<clipPath id="${id}"><path d="${eye}"/></clipPath><path d="${eye}" fill="#f1ede4"/>`);
    out.push(`<g clip-path="url(#${id})"><circle cx="${cx + 2}" cy="${cy}" r="9.5" fill="${o.iris}"/><circle cx="${cx + 2}" cy="${cy}" r="4" fill="${INK}"/><circle cx="${cx + 5}" cy="${cy - 4}" r="2.4" fill="#fff"/><path d="M${cx - 22},${cy - 16} L${cx + 22},${cy - 16} L${cx + 22},${cy - 5} Q${cx},${cy - 11} ${cx - 22},${cy - 5}Z" fill="#000" opacity=".25"/></g>`);
    out.push(`<path d="M${cx - 22},${cy + 1} Q${cx},${top - 5} ${cx + 22},${cy + 1}" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`);
    if (e === 's') out.push(`<path d="M${cx - 16},${cy + 7} Q${cx},${cy + 2} ${cx + 16},${cy + 7}" fill="none" stroke="${INK}" stroke-width="2.5"/>`);
  }
  return out.join('');
}
function brows(e, col) {
  const [inner, outer] = BROWS[e] || [0, 0];
  let L = `M146,${206 + outer} Q166,${197 + (inner + outer) / 2} 189,${207 + inner}`;
  let R = `M211,${207 + inner} Q234,${197 + (inner + outer) / 2} 254,${206 + outer}`;
  if (e === 'm') R = 'M211,204 Q234,186 254,196';
  return `<path d="${L}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round"/><path d="${R}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round"/>`;
}
// голова: кожа, жёсткая тень справа, растр, контур, подсветка слева, черты лица
function head(o, e) {
  const id = 'h' + (++uid);
  const shadow = 'M214,118 L292,118 L292,345 L196,345 L206,312 L222,282 L214,250 L226,214 L208,176 Z';
  return `
  <path d="M172,296 L170,392 Q200,410 230,392 L228,296 Z" fill="${o.skin}" stroke="${INK}" stroke-width="4"/>
  <path d="M172,318 Q200,356 228,318 L229,362 Q200,384 171,364 Z" fill="${o.shade}"/>
  <ellipse cx="128" cy="240" rx="13" ry="22" fill="${o.skin}" stroke="${INK}" stroke-width="4"/>
  <ellipse cx="272" cy="240" rx="13" ry="22" fill="${o.shade}" stroke="${INK}" stroke-width="4"/>
  <clipPath id="${id}"><path d="${HEAD}"/></clipPath>
  <path d="${HEAD}" fill="${o.skin}"/>
  <g clip-path="url(#${id})"><path d="${shadow}" fill="${o.shade}"/><path d="${shadow}" fill="url(#ht)" opacity=".7"/>${o.cheek ? `<ellipse cx="160" cy="274" rx="16" ry="8" fill="${o.cheek}" opacity=".35"/>` : ''}</g>
  <path d="${HEAD}" fill="none" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
  <path d="M130,196 C127,252 142,296 178,326" fill="none" stroke="${o.rim}" stroke-width="4" stroke-linecap="round" opacity=".95"/>
  <path d="M201,238 L193,276 Q200,283 209,277" fill="none" stroke="${INK}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
  ${eyes(e, o)}${brows(e, o.brow)}${(o.mouth || MOUTH)[e] ? (o.mouth || MOUTH)[e].replace(/INK/g, INK) : MOUTH.n.replace(/INK/g, INK)}`;
}
function svgWrap(inner, cls = '') { return `<svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMax meet" class="${cls}">${inner}</svg>`; }
function torso(fill, shade, rim, extra = '') {
  const body = 'M30,600 C40,470 108,412 168,388 L232,388 C292,412 360,470 370,600 Z';
  const id = 't' + (++uid);
  return `<clipPath id="${id}"><path d="${body}"/></clipPath><path d="${body}" fill="${fill}"/>
  <g clip-path="url(#${id})"><path d="M230,380 L380,380 L380,600 L250,600 L262,520 L240,470 Z" fill="${shade}"/><path d="M230,380 L380,380 L380,600 L250,600 L262,520 L240,470 Z" fill="url(#ht)" opacity=".6"/>${extra}</g>
  <path d="${body}" fill="none" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
  <path d="M40,598 C48,480 104,424 160,398" fill="none" stroke="${rim}" stroke-width="4" opacity=".9"/>`;
}

const CHARS = {
  mira: {
    name: 'Мира', col: '#4ef2ff',
    draw(e) {
      const o = { skin: '#e8c4a8', shade: '#a77866', iris: '#5a7a6a', brow: '#1b1d2b', rim: '#4ef2ff', cheek: '#e88a8a' };
      return svgWrap(`
        <path d="M118,300 C98,210 118,108 202,104 C286,106 306,206 284,300 L268,300 C276,230 266,182 248,160 L152,160 C134,184 124,236 134,300 Z" fill="#1b1d2b" stroke="${INK}" stroke-width="5"/>
        <path d="M118,300 L134,300 L130,284 Z M268,300 L284,300 L282,282 Z" fill="#3fd6c8"/>
        ${torso('#e2662c', '#9c3e17', '#4ef2ff', '<rect x="20" y="520" width="380" height="16" fill="#f0f0e0" opacity=".85"/><path d="M240,380 L300,600 L330,600 L262,380 Z" fill="#2a2a32"/>')}
        <path d="M150,420 C170,404 230,404 250,420 L240,446 C220,436 180,436 160,446 Z" fill="#c4521f" stroke="${INK}" stroke-width="4"/>
        ${head(o, e)}
        <path d="M122,214 C118,146 162,114 210,114 C256,114 286,146 282,206 C266,180 242,166 214,168 C206,190 186,204 160,208 C146,210 132,212 122,214 Z" fill="#1b1d2b" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
        <path d="M232,170 C250,176 266,190 276,206 L282,206 C280,186 268,170 252,162 Z" fill="#3fd6c8"/>
        <path d="M150,150 C170,132 200,128 220,134" fill="none" stroke="#3a4060" stroke-width="5" stroke-linecap="round"/>
        <circle cx="160" cy="140" r="3" fill="#fff"/><circle cx="238" cy="132" r="2.5" fill="#fff"/><circle cx="268" cy="168" r="2" fill="#fff"/><circle cx="196" cy="120" r="2" fill="#fff"/>`);
    },
  },
  valya: {
    name: 'Баба Валя', col: '#f2b65c',
    draw(e) {
      const o = { skin: '#e2c0a8', shade: '#a07a68', iris: '#6a6a7a', brow: '#8a8884', rim: '#f2a640' };
      const glasses = `<rect x="140" y="214" width="56" height="40" rx="10" fill="#cfe8ff" fill-opacity=".12" stroke="#3a2a22" stroke-width="6"/><rect x="204" y="214" width="56" height="40" rx="10" fill="#cfe8ff" fill-opacity=".12" stroke="#3a2a22" stroke-width="6"/><path d="M196,228 L204,228" stroke="#3a2a22" stroke-width="5"/><path d="M146,220 L160,220" stroke="#fff" stroke-width="3" opacity=".6"/>`;
      const lines = `<path d="M136,236 l-8,-4 M136,244 l-8,2 M264,236 l8,-4 M264,244 l8,2 M176,286 Q170,300 176,312 M224,286 Q230,300 224,312 M160,262 Q170,268 182,264" fill="none" stroke="${INK}" stroke-width="2" opacity=".55"/>`;
      const cig = e === 'w' ? '' : `<path d="M216,302 L250,292" stroke="#f4f0e4" stroke-width="7" stroke-linecap="round"/><path d="M216,302 L250,292" stroke="${INK}" stroke-width="1.5" opacity=".4"/><circle cx="251" cy="292" r="4.5" fill="#ff6a2a"/><circle cx="251" cy="292" r="9" fill="#ff6a2a" opacity=".3"/><path class="smoke" d="M254,284 C262,272 250,262 258,250 C266,238 254,228 262,216" fill="none" stroke="#cfd4dc" stroke-width="4" opacity=".5" stroke-linecap="round"/>`;
      return svgWrap(`
        ${torso('#6a3a4a', '#3c1e2a', '#f2a640', '<path d="M30,470 C120,440 280,440 370,470 L370,520 C280,494 120,494 30,520 Z" fill="#8a6a3a"/><path d="M30,470 C120,440 280,440 370,470 L370,520 C280,494 120,494 30,520 Z" fill="url(#ht)" opacity=".5"/>')}
        <path d="M120,420 C150,398 250,398 280,420 L268,452 C240,436 160,436 132,452 Z" fill="#8a6a3a" stroke="${INK}" stroke-width="4"/>
        ${head(o, e)}${lines}
        <path d="M120,214 C112,180 124,146 146,132 C150,112 176,104 192,112 C206,98 236,104 244,118 C266,118 284,140 282,166 C292,184 288,206 280,216 C272,196 264,180 248,172 C230,168 206,170 188,168 C166,170 146,176 134,190 C126,198 122,206 120,214 Z" fill="#b8b6b2" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
        <path d="M150,136 C160,126 172,124 182,128 M208,116 C220,112 234,116 240,124 M250,140 C262,142 272,152 274,166" fill="none" stroke="#e0dfdc" stroke-width="4" stroke-linecap="round"/>
        <path d="M238,170 C256,174 272,190 280,214 L282,166 C272,148 256,140 244,140 Z" fill="#8a8884" opacity=".7"/>
        ${glasses}${cig}`);
    },
  },
  pyat: {
    name: 'Пяткин', col: '#6aa8ff',
    draw(e) {

function windowsGrid(x, y, cols, rows, w, h, gx, gy, seed, lit = .35) {
  const r = rng(seed); let s = '';
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const v = r(); const col = v < lit * .6 ? '#f2c66a' : v < lit ? '#7ac8ff' : v < lit + .04 ? '#ff5ab4' : '#141826';
    s += `<rect x="${x + i * gx}" y="${y + j * gy}" width="${w}" height="${h}" fill="${col}" opacity="${col === '#141826' ? 1 : .85}"/>`;
  }
  return s;
}

function showEpisodes() {
  showScreen(`<div class="tag">Эпизоды</div>
    <div class="ep"><b>Эпизод 1 · Уведомление</b><small>${meta.done[1] ? 'пройден' : meta.cur ? 'в процессе' : 'новый'}</small></div>
    <div class="ep locked"><b>Эпизод 2 · Резервная копия</b><small>скоро</small></div>
    <div class="menu"><button class="pri" id="e1">${meta.done[1] ? 'Переиграть эпизод 1' : 'Начать эпизод 1'}</button><button id="eb">Назад</button></div>`, s => {
    s.querySelector('#e1').onclick = () => startEpisode(1);
    s.querySelector('#eb').onclick = showTitle;
  });
}
function enterGame() {
  hideScreen(); $('top').classList.remove('hidden');
  LOG.length = 0;
}
function startEpisode(n) {
  enterGame();
  S0 = { ep: n, l: 'start', i: 0, v: defaultsV(), bg: 'black', who: null, e: 'n', time: '00:00' };
  setBg('black', true); showChar(null);
  run();
}
function resume() {
  enterGame();
  S0 = meta.cur;
  setBg(S0.bg || 'black', true); setTime(S0.time || '00:00');
  VIEW.who = null; if (S0.who) showChar(S0.who, S0.e); else showChar(null);
  run();
}

// ====================== Погода и зерно ======================
const wc = $('weather'), wx = wc.getContext('2d');
let weatherLevel = 0, flakes = [];
function sizeWeather() { const r = $('stage').getBoundingClientRect(); wc.width = r.width; wc.height = r.height; }
function frameWeather() {
  wx.clearRect(0, 0, wc.width, wc.height);
  const want = Math.round(weatherLevel * 140);
  while (flakes.length < want) flakes.push({ x: Math.random() * wc.width, y: Math.random() * wc.height, s: .6 + Math.random() * 2.2, v: 20 + Math.random() * 40, w: Math.random() * 6 });
  if (flakes.length > want) flakes.length = want;
  wx.fillStyle = 'rgba(230,236,250,.75)';
  for (const f of flakes) {
    f.y += f.v / 60; f.x += Math.sin((f.y + f.w * 40) / 40) * .4 - .25;
    if (f.y > wc.height) { f.y = -4; f.x = Math.random() * wc.width; }
    wx.beginPath(); wx.arc(f.x, f.y, f.s, 0, 7); wx.fill();
  }
  requestAnimationFrame(frameWeather);
}
const gc = $('grain').getContext('2d');
setInterval(() => {
  const img = gc.createImageData(160, 160);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  gc.putImageData(img, 0, 0);
}, 90);

// ====================== Управление ======================
$('stage').addEventListener('click', e => {
  if (e.target.closest('button') || e.target.closest('#over') || e.target.closest('#modal') || e.target.closest('#screen')) return;
  audio(); startHum(); advance();
});
document.addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && !$('screen').innerHTML) { e.preventDefault(); advance(); } });
$('bLog').onclick = e => {
  e.stopPropagation();
  modal(`<h2>Журнал</h2><div class="log">${LOG.slice(-60).map(l => `<p class="${l.who ? '' : 'th'}">${l.who ? `<b style="color:${l.col}">${l.who}</b><br>` : ''}${l.t.replace(/</g, '&lt;')}</p>`).join('') || '<p class="th">Пока пусто.</p>'}</div><div class="menu"><button class="pri">Закрыть</button></div>`, m => {
    m.querySelector('button.pri').onclick = closeModal; const lg = m.querySelector('.log'); m.scrollTop = m.scrollHeight;
  });
};
$('bMenu').onclick = e => {
  e.stopPropagation();
  modal(`<h2>Пауза</h2><p style="color:#9a98a8;font-size:14px">Игра сохраняется сама после каждой реплики.</p><div class="menu">
    <button class="pri" id="mC">Продолжить</button><button id="mS">Звук: ${meta.sound ? 'вкл' : 'выкл'}</button><button id="mM">Главное меню</button>${FROM_HUB ? '<button id="mH">← К выбору игр</button>' : ''}</div>`, m => {
    m.querySelector('#mC').onclick = closeModal;
    m.querySelector('#mS').onclick = ev => { setSound(!meta.sound); ev.target.textContent = `Звук: ${meta.sound ? 'вкл' : 'выкл'}`; };
    m.querySelector('#mM').onclick = () => { closeModal(); persist(true); showTitle(); };
    const h = m.querySelector('#mH'); if (h) h.onclick = goHub;
  });
};
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(true); });

// ====================== Запуск ======================
setupTelegram();
new ResizeObserver(sizeWeather).observe($('stage'));
sizeWeather(); requestAnimationFrame(frameWeather);
load(showTitle);
</script>
</body>
</html>
