<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Бесконечный поезд</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0c13;--panel:#161925;--panel2:#1f2334;--line:#2d3248;--text:#ede7d9;--dim:#9a96ad;--amber:#f2b65c;--red:#e65a6c;--green:#72d48f;--blue:#6fb4ff;--violet:#ab8dff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(1px);filter:brightness(1.25)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--amber);color:#1b1307;border-color:var(--amber);font-weight:700}
button.danger{border-color:#6a2b36;color:#ffb3bd}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#hud{padding:8px 12px 5px;display:flex;flex-direction:column;gap:5px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.hrow b{color:var(--amber)}
#hGold{color:#f2c66a}
.bars{display:flex;gap:6px}
.bar{position:relative;flex:1;height:16px;border-radius:8px;background:#22253a;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .2s}
.bar.hp i{background:linear-gradient(#f06e7d,#c13c55)}
.bar.mp i{background:linear-gradient(#94acff,#5168e0)}
.bar b{position:relative;display:block;text-align:center;font-size:11px;line-height:16px;font-weight:600;text-shadow:0 1px 2px #000}
.xp{height:3px;background:#22253a;border-radius:2px;overflow:hidden}.xp i{display:block;height:100%;width:0;background:var(--amber);transition:width .2s}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;left:0;top:0;touch-action:none}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:max-content;max-width:92%;padding:7px 14px;border-radius:12px;background:rgba(12,13,21,.9);border:1px solid var(--line);font-size:13px;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#log{height:38px;padding:0 14px;font-size:12px;line-height:18px;color:var(--dim);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log div:last-child{color:var(--text)}
#controls{display:flex;justify-content:space-between;align-items:center;padding:4px 14px calc(10px + env(safe-area-inset-bottom));gap:14px}
#dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,44px);gap:4px;touch-action:none}
#dpad button{font-size:17px;padding:0}
#dpad .wait{font-size:12px;color:var(--dim)}
#acts{flex:1;display:flex;flex-direction:column;gap:6px;max-width:200px}
#acts button{padding:9px 11px;display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left}
#acts small{color:var(--dim);font-size:11px}
#bAbility.ready{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,6,11,.7);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.hidden{display:none!important}
.panel{width:100%;max-width:420px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 20px 60px #000a}
.panel h2{margin:0 0 8px;font-size:18px}
.panel p{margin:6px 0;color:#dcd5c6}
.panel .muted{color:var(--dim);font-size:12px}
.note{font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.55;background:#efe6cf;color:#2b2418;padding:14px 16px;border-radius:4px;transform:rotate(-.6deg);box-shadow:0 6px 18px #0008}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.btns button{padding:11px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.cmp div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px}
.cmp b{display:block;margin-bottom:2px}
.r1{color:#7fc7ff}.r2{color:#ffb84d}
.inv{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.inv .it{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.inv .it i{width:12px;height:12px;border-radius:50%;flex:none}
.inv .it div{flex:1;font-size:13px}.inv .it small{display:block;color:var(--dim);font-size:11px}
.inv .it button{padding:6px 10px;font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px;color:var(--dim);margin:8px 0}
.stats span b{color:var(--text)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.keys button{padding:12px 0;font-size:18px;font-weight:600}
.disp{display:flex;justify-content:center;gap:10px;margin:10px 0}
.disp span{width:46px;height:54px;border-radius:8px;background:#0e1018;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:700 26px ui-monospace,monospace;color:var(--amber)}
.disp.bad span{border-color:var(--red);color:var(--red)}
.known{text-align:center;font:600 15px ui-monospace,monospace;color:var(--dim);letter-spacing:4px}
.lights{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center;margin:14px 0}
.lights button{height:64px;border-radius:50%;background:#2a2016;border:2px solid #4a3a26}
.lights button.on{background:radial-gradient(#fff3c0,#f2b65c 55%,#a8661c);border-color:#ffd88a;box-shadow:0 0 18px #f2b65c99}
.lights button.hint{outline:2px dashed var(--green);outline-offset:3px}
.simon{display:grid;grid-template-columns:repeat(2,96px);gap:12px;justify-content:center;margin:14px 0}
.simon button{height:96px;border-radius:18px;opacity:.45;border:2px solid #0006}
.simon button.lit{opacity:1;box-shadow:0 0 22px currentColor}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opts button{padding:11px}
.shop{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.shop button{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;text-align:left;gap:10px}
.shop button small{display:block;color:var(--dim);font-size:11px}
.shop .price{color:#f2c66a;white-space:nowrap}
.shop b{display:block;font-weight:600}.shop span:first-child{font-size:13px}
.perks{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.perks button{padding:11px;text-align:left}.perks button small{display:block;color:var(--dim)}
/* полноэкранные экраны */
#screen:empty{display:none}
#screen{position:fixed;inset:0;z-index:20;overflow:auto;background:linear-gradient(rgba(7,8,14,.45),rgba(7,8,14,.94) 70%)}
#screen .wrap{min-height:100%;max-width:460px;margin:0 auto;padding:28px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center}
.logo{font:700 clamp(26px,8.6vw,40px)/1.05 Georgia,"Times New Roman",serif;letter-spacing:1px;text-align:center;color:#ffe2a8;text-shadow:0 0 24px #f2b65c88,0 3px 0 #6b3f12}
.sub{text-align:center;color:var(--dim);margin:10px 0 26px}
.rec{text-align:center;color:var(--dim);font-size:12px;margin-top:16px}
.classes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.cls{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px}
.cls canvas{width:64px;height:64px;align-self:center}
.cls b{font-size:15px}.cls p{margin:0;font-size:11.5px;color:var(--dim);line-height:1.35}
.cls .ab{color:var(--amber);font-size:11.5px}
.cls.locked{filter:grayscale(1);opacity:.55}
.cls.sel{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.story{font:17px/1.6 Georgia,"Times New Roman",serif;color:#e9dfc8;min-height:150px;display:flex;align-items:center;text-align:center;justify-content:center;padding:10px}
.dots{display:flex;justify-content:center;gap:6px;margin:14px 0}.dots i{width:7px;height:7px;border-radius:50%;background:#3a3f57}.dots i.on{background:var(--amber)}
.journal{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.journal .note{transform:none;font-size:14px}
.journal .lockn{color:var(--dim);font-size:13px;padding:10px 14px;border:1px dashed var(--line);border-radius:6px}
h1.death{font:700 28px Georgia,serif;text-align:center;color:#ffb3bd;margin:0 0 8px}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hrow"><span id="hClass"></span><span id="hWagon"></span><span id="hGold"></span></div>
    <div class="bars"><div class="bar hp"><i id="hpFill"></i><b id="hpTxt"></b></div><div class="bar mp" id="mpBar"><i id="mpFill"></i><b id="mpTxt"></b></div></div>
    <div class="xp"><i id="xpFill"></i></div>
  </header>
  <div id="stage"><canvas id="cv"></canvas><div id="toast"></div></div>
  <div id="log"></div>
  <div id="controls">
    <div id="dpad">
      <span></span><button data-d="0,-1" aria-label="Вверх">▲</button><span></span>
      <button data-d="-1,0" aria-label="Влево">◀</button><button data-d="0,0" class="wait" aria-label="Ждать">ждать</button><button data-d="1,0" aria-label="Вправо">▶</button>
      <span></span><button data-d="0,1" aria-label="Вниз">▼</button><span></span>
    </div>
    <div id="acts">
      <button id="bAbility"><span id="abName">Умение</span><small id="abInfo"></small></button>
      <button id="bBag"><span>Сумка</span><small id="bagInfo"></small></button>
      <button id="bMenu"><span>Меню</span><small></small></button>
    </div>
  </div>
</div>
<div id="ov" class="ov hidden"><div class="panel" id="ovPanel"></div></div>
<div id="screen"></div>

<script>
'use strict';
// ====================== Основа ======================
const W = 7, H = 12, MID = 3;            // внутренность вагона: 7 клеток в ширину, 12 в длину
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rint = n => Math.floor(Math.random() * n);
const rpick = a => a[rint(a.length)];
const K = (x, y) => x + ',' + y;
const dist = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
const cheb = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
const inside = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rint(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function plural(n, a, b, c) { const m = n % 100, l = n % 10; return m > 10 && m < 20 ? c : l === 1 ? a : l >= 2 && l <= 4 ? b : c; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// генератор вагона детерминирован: тот же сид и номер дают тот же вагон (нужно для «Продолжить»)
let G = Math.random;
const gi = n => Math.floor(G() * n);
const gp = a => a[gi(a.length)];

// ====================== Данные ======================
const CLASSES = {
  guard: { n: 'Сторож', col: '#c47a3c', hp: 32, atk: 4, def: 1, crit: .05, eva: .03, mana: 0, cd: 5, ab: 'Размах', abd: 'Бьёт всех врагов вокруг.',
    d: 'Когда-то сторожил склад, в котором ничего не было. Крепкий и прямолинейный.' },

};

const MON = {

  shade: { n: 'Тень проводника', sh: 'man', col: '#2e2745', hp: 11, atk: 4, ai: 'melee', xp: 5, hat: 'cap', glow: true },

const BOSSES = [
  { n: 'Контролёр', col: '#34467a', hp: 42, atk: 5, every: 3, sp: ['cross'], minion: 'stowaway',
    intro: '«Предъявите билет!» Контролёр щёлкает компостером, и половицы вокруг вспыхивают красным. Уходи с подсвеченных клеток.',

  { n: 'Обер-кондуктор', col: '#6b2635', hp: 60, atk: 6, every: 3, sp: ['square', 'summon'], minion: 'shade',
    intro: '«Поезд следует без остановок», — говорит Обер-кондуктор. За его спиной поднимаются тени.',

    intro: 'Кабина. За стеклом — темнота и рельсы. Машинист медленно оборачивается, не снимая руки с рычага.', win: null },
];

// стиль каждого вагона: цвета, узор пола, препятствия, обитатели, ловушки, частицы
const THEMES = {
  plackart: { n: 'Плацкарт', floor: ['#5b4331', '#523b2b'], pat: 'planks', wall: '#2b3a4c', trim: '#a5794c', obs: 'bunk', oc: '#3c5a78', ot: '#6a8fb3', light: '#ffd78a', dark: .45, amb: 'dust', win: 'night', lay: 'bunks',

    lines: ['Пахнет варёными яйцами и чужими разговорами. Где-то храпят на верхней полке.', 'Полки застелены, но никто на них не спит. Стаканы звенят в подстаканниках.'] },
  restaurant: { n: 'Вагон-ресторан', floor: ['#d8cfbd', '#7b2433'], pat: 'checker', wall: '#3b1a22', trim: '#c9a25a', obs: 'table', oc: '#efe9dc', ot: '#b8343f', light: '#ffc27a', dark: .4, amb: 'steam', win: 'night', lay: 'tables',
    mons: ['pot', 'rat', 'chef'], decor: ['napkin', 'crumbs'],

  library: { n: 'Библиотека', floor: ['#22402f', '#2c5039'], pat: 'carpet', wall: '#2a2118', trim: '#b08a4a', obs: 'shelf', oc: '#4a3220', ot: '#6b4a2c', light: '#ffe0a0', dark: .5, amb: 'dust', win: 'night', lay: 'shelves',

const hapticLast = {};
function haptic(name) {

function readLS(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function writeLS(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function loadAll(done) {
  const lm = readLS(META_KEY), lr = readLS(RUN_KEY);
  const newer = (a, b) => a && (!b || (a.ts || 0) > (b.ts || 0)) ? a : b;
  const apply = (m, r) => {
    meta = Object.assign(metaDefaults(), m || {});
    // поездка считается живой, только если её номер совпадает с записанным в мета (после смерти он стирается)
    savedRun = r && meta.runId && r.id === meta.runId ? r : null;
    applyEpoch();
    done();
  };
  if (!cloud) return apply(lm, lr);
  let fin = false;
  const fb = setTimeout(() => { if (!fin) { fin = true; apply(lm, lr); } }, 2500);
  cloud.getItems([META_KEY, RUN_KEY], (err, vals) => {
    if (fin) return;
    fin = true; clearTimeout(fb);
    let cm = null, cr = null;
    try { if (!err && vals) { cm = vals[META_KEY] ? JSON.parse(vals[META_KEY]) : null; cr = vals[RUN_KEY] ? JSON.parse(vals[RUN_KEY]) : null; } } catch (e) {}
    apply(newer(cm, lm), newer(cr, lr));
  });
}
let epochReset = false;
function applyEpoch() {
  if (!URL_EPOCH || URL_EPOCH <= (meta.epoch || 0)) return;
  epochReset = !!meta.ts;
  meta = Object.assign(metaDefaults(), { sound: meta.sound, epoch: URL_EPOCH });
  savedRun = null;
  persistMeta(); clearRun();
}
function persistMeta() {
  meta.ts = Date.now();
  writeLS(META_KEY, meta);
  if (cloud) try { cloud.setItem(META_KEY, JSON.stringify(meta)); } catch (e) {}
}
function saveRun() {
  if (!run) return;
  run.ts = Date.now();
  writeLS(RUN_KEY, run);
  if (cloud) try { cloud.setItem(RUN_KEY, JSON.stringify(run)); } catch (e) {}
}
function clearRun() {
  writeLS(RUN_KEY, null);
  if (cloud) try { cloud.removeItem(RUN_KEY); } catch (e) {}
}

function trap(tr, x, y) {

  const n = run.wagon;

    wg.traps.delete(K(x, y)); p.gold += 2;
    floater(x, y, 'обезврежено', '#72d48f'); log(`Механик разобрал ловушку «${TRAPS[tr.t].n}» (+2 ◉).`); sfx('key');

function ventActive(tr) { return (wg.turn + tr.off) % 3 === 2; }

    for (let i = 0; i < 4; i++) parts.push({ x: (x + 1.5) * TS + (Math.random() - .5) * TS * .5, y: (y + 1.5) * TS, vx: (Math.random() - .5) * 10, vy: -30 - Math.random() * 30, life: .9, max: .9, col: '#e8eef5', sz: TS * .18, kind: 'puff' });

function tryExit() {
  if (!wg.open) {
    const why = wg.lock === 'monsters' ? 'Дверь заблокирована, пока в вагоне есть чудища.' : wg.lock === 'puzzle' ? 'Дверь заперта на механизм. Найди пульт рядом с дверью.' : 'Хозяин вагона не отпустит тебя просто так.';
    toast(why); sfx('fail'); return;
  }
  busy = true; sfx('door'); fx.fadeTo = 1;
  // передышка в тамбуре между вагонами
  const rest = Math.round(maxHp() * .15);
  setTimeout(() => { heal(rest, true); enterWagon(run.wagon + 1); }, 330);
}
function checkDoor() {
  if (wg.open) return;
  if ((wg.lock === 'monsters' || wg.lock === 'boss') && !alive().length) openDoor('Последнее чудище пало. Дверь в следующий вагон открылась.');
}
function openDoor(msg) {
  if (wg.open) return;
  wg.open = true; sfx('door'); haptic('win'); toast(msg); log(msg);
}

function endTurn() {
  wg.turn++;
  if (p.cd > 0) p.cd--;
  if (p.maxMana && p.mana < p.maxMana && wg.turn % 2 === 0) p.mana++;
  if (p.regen > 0) { p.regen--; heal(1, true); }
  if (p.invis > 0) { p.invis--; if (!p.invis) p.shadow = false; }
  monstersAct();
  if (p.hp <= 0) return;
  ventsTick();
  if (p.hp <= 0) return;
  if (p.cls === 'thief') for (const [k, tr] of wg.traps) {
    const [x, y] = k.split(',').map(Number);
    if (tr.hidden && Math.max(Math.abs(x - p.x), Math.abs(y - p.y)) <= 2) { tr.hidden = false; floater(x, y, 'ловушка', '#f2b65c'); log(`Ты заметила ловушку «${TRAPS[tr.t].n}».`); }
  }
  checkDoor();
  dirty = true;
  if (p.stun > 0) {
    p.stun--; inputLock = true; floater(p.x, p.y, 'оцепенение', '#c8b8ff', .2);
    setTimeout(() => { inputLock = false; if (p.hp > 0 && wg) endTurn(); }, 420);
  }
}

function ability() {
  if (!canAct()) return;
  const c = p.cls;
  if (c === 'medium') {
    if (p.mana < 3) return toast('Не хватает маны: нужно 3.');
    const ts = alive().filter(m => dist(m, p) <= 7 && (m.ai !== 'mimic' || m.awake)).sort((a, b) => dist(a, p) - dist(b, p));
    if (!ts.length) return toast('Молнии некуда бить.');
    const m = ts[0]; p.mana -= 3;
    shots.push({ x0: p.x, y0: p.y, x1: m.x, y1: m.y, t: 0, col: '#cbb8ff', bolt: true });
    sfx('zap');
    hurtMon(m, 3 + Math.floor(p.lvl * .6) + Math.floor(run.wagon / 3) + (p.perks.bolt || 0), false);
    return endTurn();
  }
  if (p.cd > 0) return toast(`${CLASSES[c].ab} будет готов через ${p.cd} ${plural(p.cd, 'ход', 'хода', 'ходов')}.`);
  if (c === 'guard') {
    const ts = alive().filter(m => cheb(m, p) === 1);
    if (!ts.length) return toast('Рядом нет врагов.');
    for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; parts.push({ x: (p.x + 1.5) * TS + Math.cos(a) * TS * .6, y: (p.y + 1.5) * TS + Math.sin(a) * TS * .6, vx: Math.cos(a) * 40, vy: Math.sin(a) * 40, life: .3, max: .3, col: '#ffd9a0', sz: 3 }); }
    ts.forEach(m => playerAttack(m, 1.2));
  }
  if (c === 'thief') { p.invis = 3; p.shadow = true; toast('Ты растворилась в тени. Следующий удар втрое сильнее.'); }
  if (c === 'mech') {
    const ts = alive().filter(m => cheb(m, p) <= 1);
    if (!ts.length) return toast('Рядом нет врагов.');
    burst(p.x, p.y, '#9fd3ff', 24, 1.2); sfx('zap');
    ts.forEach(m => { m.stun = Math.max(m.stun, 2); hurtMon(m, 2 + Math.floor(p.lvl / 2)); });
  }
  p.cd = p.cdMax + 1;
  endTurn();
}

function useItem(i) {
  const id = p.inv[i], n = run.wagon;
  let ok = true;
  switch (id) {
    case 'medkit': if (p.hp >= maxHp()) { toast('Ты и так здоров.'); ok = false; break; } heal(Math.ceil(maxHp() * .5)); break;
    case 'tea': heal(5); p.regen += 6; break;
    case 'boom': {
      const ts = alive().filter(m => cheb(m, p) <= 2);
      if (!ts.length) { toast('Рядом нет врагов.'); ok = false; break; }
      burst(p.x, p.y, '#ffcf6a', 36, 1.6); sfx('boom'); fx.shake = .8;
      ts.forEach(m => hurtMon(m, 6 + Math.floor(n / 2)));
      break;
    }
    case 'whistle': {
      const ts = alive(); if (!ts.length) { toast('Здесь некого пугать.'); ok = false; break; }
      ts.forEach(m => { m.stun = Math.max(m.stun, 2); m.awake = true; }); tone(1800, .5, 'sine', .08); break;
    }
    case 'candle': p.mana = p.maxMana; heal(4); break;
    case 'ticket':
      if (wg.open) { toast('Дверь уже открыта.'); ok = false; break; }
      if (wg.lock === 'boss') { toast('Хозяин вагона билетов не принимает.'); ok = false; break; }
      openDoor('Билет пробит. Дверь открылась.'); break;
    case 'lamp': {
      let c = 0; wg.traps.forEach(t => { if (t.hidden) { t.hidden = false; c++; } });
      toast(c ? `Фонарик высветил ${c} ${plural(c, 'ловушку', 'ловушки', 'ловушек')}.` : 'Ловушек не видно.'); break;
    }
  }
  if (!ok) return false;
  p.inv.splice(i, 1); sfx('pick');
  log('Использовано: ' + CONSUM[id].n);
  endTurn();
  return true;

// ====================== Чудища ======================
function blockedForMon(x, y, ghost) {
  if (!inside(x, y)) return true;
  if (!ghost && (wg.tiles[y][x] || blockObj(x, y))) return true;
  return !!monAt(x, y) || (x === p.x && y === p.y);
}
function moveMon(m, x, y) { m.x = x; m.y = y; }
function stepToward(m, ghost) {
  const dm = new Int16Array(W * H).fill(-1), q = [p.x + p.y * W];
  dm[q[0]] = 0;
  for (let qi = 0; qi < q.length; qi++) {
    const c = q[qi], x = c % W, y = (c - x) / W;
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (!inside(nx, ny)) continue;
      const ni = nx + ny * W;
      if (dm[ni] >= 0) continue;
      if (!ghost && (wg.tiles[ny][nx] || blockObj(nx, ny))) continue;
      dm[ni] = dm[c] + 1; q.push(ni);
    }
  }
  let best = null, bd = dm[m.x + m.y * W]; if (bd < 0) bd = 999;
  for (const [dx, dy] of shuffle(DIRS.slice())) {
    const nx = m.x + dx, ny = m.y + dy;
    if (!inside(nx, ny)) continue;
    const d = dm[nx + ny * W];
    if (d < 0 || blockedForMon(nx, ny, ghost)) continue;
    if (d < bd) { bd = d; best = [nx, ny]; }
  }
  if (best) { moveMon(m, best[0], best[1]); return true; }
  return false;
}
function wander(m) {
  for (const [dx, dy] of shuffle(DIRS.slice())) { const nx = m.x + dx, ny = m.y + dy; if (!blockedForMon(nx, ny, m.ai === 'ghost')) { moveMon(m, nx, ny); return; } }
}
function inLine(m, range) {
  if (m.x !== p.x && m.y !== p.y) return false;
  const d = dist(m, p); if (d > range) return false;
  const sx = Math.sign(p.x - m.x), sy = Math.sign(p.y - m.y);
  for (let i = 1; i < d; i++) { const x = m.x + sx * i, y = m.y + sy * i; if (wg.tiles[y][x] || blockObj(x, y) || monAt(x, y)) return false; }
  return true;
}
function monAttack(m, ranged) {
  const s = S();
  if (!ranged) { m.lx = (p.x - m.x) * TS * .3; m.ly = (p.y - m.y) * TS * .3; }
  if (Math.random() < s.evade) { floater(p.x, p.y, 'мимо', '#9a96ad'); sfx('miss'); return; }
  const dmg = Math.max(1, m.atk + rint(2) - s.def);
  hurtPlayer(dmg, m.d.n);
  if (p.hp > 0 && m.d.chill && Math.random() < .3) { p.stun = Math.max(p.stun, 1); floater(p.x, p.y, 'озноб', '#8fd0e8', .3); }
  if (s.thorns && !ranged && m.hp > 0) hurtMon(m, s.thorns);
}
function shoot(m) {
  shots.push({ x0: m.x, y0: m.y, x1: p.x, y1: p.y, t: 0, col: m.d.shot || '#fff' });
  sfx('shoot'); monAttack(m, true);
}
function monstersAct() {
  for (const m of wg.mons) {
    if (m.hp <= 0 || p.hp <= 0) continue;
    if (m.stun > 0) { m.stun--; continue; }
    if (!m.awake) {
      if (cheb(m, p) <= 1) { m.awake = true; floater(m.x, m.y, '!', '#ff6b7d', 0, 1.4); if (m.ai === 'mimic') log('Посылка распахнулась — у неё зубы!'); }
      continue;
    }
    if (m.boss) { bossAct(m); continue; }
    if (m.ai === 'slow') { m.tick ^= 1; if (m.tick && dist(m, p) > 1) continue; }
    const steps = m.ai === 'fast' ? 2 : 1;
    for (let s = 0; s < steps && p.hp > 0 && m.hp > 0; s++) monStep(m);
  }
}
function monStep(m) {
  const d = dist(m, p), hidden = p.invis > 0;
  if (d === 1 && !hidden) return monAttack(m);
  if (m.ai === 'static') return;
  if ((m.ai === 'turret' || m.ai === 'ranged') && !hidden && inLine(m, 5)) return shoot(m);
  if (m.ai === 'turret') return;
  if (hidden || (m.ai === 'erratic' && Math.random() < .5)) { if (Math.random() < .6) wander(m); return; }
  stepToward(m, m.ai === 'ghost');
}
function bossAct(b) {
  b.turn++;
  if (b.tele) {
    const hit = b.tele.some(([x, y]) => x === p.x && y === p.y);
    b.tele.forEach(([x, y]) => burst(x, y, '#ff5a5a', 3, .5));
    fx.shake = .6; sfx('boom'); haptic('boss');
    if (hit) hurtPlayer(b.atk + 4, b.d.n);
    b.tele = null; return;
  }
  if (b.turn % b.every === 0) {
    const sp = b.sp[Math.floor(b.turn / b.every) % b.sp.length];
    if (sp === 'cross') {
      b.tele = [];
      for (let x = 0; x < W; x++) if (!wg.tiles[p.y][x]) b.tele.push([x, p.y]);
      for (let y = 0; y < H; y++) if (y !== p.y && !wg.tiles[y][p.x]) b.tele.push([p.x, y]);
      log(`${b.d.n}: «Ваш билет!» — пол под ногами вспыхивает крестом.`);
    } else if (sp === 'square') {
      b.tele = [];
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const x = p.x + dx, y = p.y + dy; if (inside(x, y) && !wg.tiles[y][x]) b.tele.push([x, y]); }
      log(`${b.d.n} заносит руку — уйди из красного квадрата!`);
    } else {
      let c = 0;
      for (const [dx, dy] of shuffle(DIRS.slice())) { const x = b.x + dx, y = b.y + dy; if (c < 2 && !blockedForMon(x, y) ) { const mm = mkMon(b.minion, x, y, run.wagon); mm.hp = mm.maxHp = Math.ceil(mm.hp * .7); mm.xp = 1; wg.mons.push(mm); burst(x, y, '#c8b8ff', 10, .7); c++; } }
      log(`${b.d.n} зовёт подмогу.`);
    }
    haptic('boss'); return;
  }
  if (dist(b, p) === 1 && !p.invis) return monAttack(b);
  if (!p.invis) stepToward(b, false);
}
function bossDown(b) {
  fx.shake = 1; sfx('win'); haptic('win');
  wg.mons.forEach(m => { if (m.hp > 0) { m.hp = 0; burst(m.x, m.y, m.d.col, 10, .8); } });
  dropAt(b.x, b.y, { t: 'equip', e: mkEquip(Math.random() < .5 ? 'w' : 'a', run.wagon + 4) }, true);
  dropAt(b.x, b.y, { t: 'gold', v: 15 + run.wagon }, true);
  dropAt(b.x, b.y, { t: 'item', id: 'medkit' }, true);
  openDoor(`${b.d.n} повержен. Дверь открыта.`);
  const bd = BOSSES[b.bidx];
  if (bd.win) queueModal({ title: b.d.n, body: `<p>${bd.win}</p>`, buttons: [{ t: 'Дальше', pri: true }] });
  else if (!meta.ending) { meta.ending = true; persistMeta(); queueModal(slidesModal('Конец пути?', ENDING, 'Вести поезд дальше')); }
  else queueModal({ title: b.d.n, body: '<p>Машинист снова растворяется в темноте кабины. Поезд идёт дальше, и ты вместе с ним.</p>', buttons: [{ t: 'Дальше', pri: true }] });
}

// ====================== Смерть и вагоны ======================
function die() {
  busy = true; haptic('lose'); sfx('fail');
  burst(p.x, p.y, '#ff6b7d', 30, 1.2);
  meta.best = Math.max(meta.best, run.wagon);
  meta.runId = null; persistMeta(); clearRun(); guardClosing(false);
  const r = run;
  setTimeout(() => { mq.length = 0; closeModalNow(); showDeath(r); }, 900);
}
function enterWagon(n, resumed) {
  run.wagon = n;
  const wasBest = meta.best;
  meta.best = Math.max(meta.best, n);
  p.x = MID; p.y = H - 1; p.vx = MID; p.vy = H - 1; p.stun = 0;
  saveRun();
  entrySnap = JSON.stringify(run);
  wg = genWagon(n);
  if (p.cls === 'mech' && wg.known) wg.known[rint(3)] = true;
  persistMeta();
  buildStatic();
  busy = false; inputLock = false;
  fx.fade = 1; fx.fadeTo = 0;
  fx.banner = { a: `Вагон ${n}`, b: wg.th.n, t: 0 };
  parts = []; shots = []; floaters = [];
  log(`Вагон ${n}. ${gp(wg.th.lines)}`);
  if (wasBest < 10 && meta.best >= 10) queueModal({ title: 'Новый класс', body: '<p>Открыт класс <b>Медиум</b>. Выбрать его можно в начале новой поездки.</p>', buttons: [{ t: 'Хорошо', pri: true }] });
  if (wg.kind === 'boss' && !resumed) { const b = wg.mons[0]; queueModal({ title: b.d.n, body: `<p>${BOSSES[b.bidx].intro}</p>`, buttons: [{ t: 'К бою', pri: true }] }); }
  else if (wg.lock === 'monsters') setTimeout(() => toast('Дверь откроется, когда в вагоне не останется чудищ.'), 900);
  else if (wg.lock === 'puzzle') setTimeout(() => toast('Дверь заперта. Пульт с замком — у двери.'), 900);
  else if (wg.kind === 'service') setTimeout(() => toast('Проводник ждёт у самовара. Подойди и поговори.'), 900);
  if (n === 1 && !resumed) setTimeout(() => toast('Свайпай, жми стрелки или тапай по клетке. Чтобы ударить, иди на врага.', 5000), 1200);
  dirty = true;
}

// ====================== Окна (модалки) ======================
const mq = [];
let curModal = null;

function nextModal() {
  const o = mq.shift();

  if (!o) { curModal = null; ov.classList.add('hidden'); pn.innerHTML = ''; dirty = true; return; }
  curModal = o;
  pn.innerHTML = `${o.title ? `<h2>${o.title}</h2>` : ''}<div class="mb">${o.body || ''}</div>${o.buttons && o.buttons.length ? '<div class="btns"></div>' : ''}`;
  const bx = pn.querySelector('.btns');
  (o.buttons || []).forEach(b => {
    const el = document.createElement('button');
    el.textContent = b.t; if (b.pri) el.className = 'pri'; if (b.danger) el.className = 'danger';
    el.onclick = () => { haptic('click'); const r = b.f && b.f(); if (r !== 'keep') nextModal(); };
    bx.appendChild(el);

  if (o.open) o.open(pn.querySelector('.mb'));
}
function closeModalNow() { curModal = null; $('ov').classList.add('hidden'); $('ovPanel').innerHTML = ''; }

function perkModal() {

        const b = document.createElement('button');

        box.appendChild(b);

}
function eqLine(e) {

  if (e.hp) st.push(`+${e.hp} к здоровью`);
  if (e.crit) st.push(`${e.crit > 0 ? '+' : ''}${Math.round(e.crit * 100)}% крит`);
  if (e.evade) st.push(`${e.evade > 0 ? '+' : ''}${Math.round(e.evade * 100)}% уклонение`);
  if (e.stun) st.push(`${Math.round(e.stun * 100)}% оглушить`);
  if (e.vamp) st.push(`лечит ${e.vamp} за удар`);

}
function equipModal(o, x, y) {

const cv = $('cv'), ctx = cv.getContext('2d');

function drawWindows(c, th) {

    c.save(); rr(c, wn.x, wn.y, wn.w, wn.h, TS * .06); c.clip();
    const g = c.createLinearGradient(0, wn.y, 0, wn.y + wn.h); g.addColorStop(0, pal[0]); g.addColorStop(1, pal[1]);

      const xx = wn.x + ((i * 37 + wn.y) % wn.w);

      else circ(c, xx, yy, i % 3 ? 1 : 1.6, th.win === 'red' ? 'rgba(255,120,90,.7)' : 'rgba(255,255,230,.75)');
    }

    c.restore();
  }
}

      c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.moveTo(cx - s * .12, cy - s * .22); c.lineTo(cx - s * .04, cy - s * .22); c.lineTo(cx - s * .02, cy + s * .1); c.fill();
      eyes(c, cx, cy - s * .1, s, ex, ey, .07, .04, '#fff', '#2a5a8a');
      break;
    }
    case 'chest':
      if (asleep) drawChest(c, cx, cy + s * .05, s, false, '#8a5a2e');
      else {
        const j = Math.abs(Math.sin(t * 8)) * s * .08;
        rr(c, cx - s * .3, cy - s * .08, s * .6, s * .36, s * .06, col);
        rr(c, cx - s * .3, cy - s * .32 - j, s * .6, s * .18, s * .06, mix(d.col, '#000000', .2));
        c.fillStyle = '#3a0a10'; c.fillRect(cx - s * .26, cy - s * .14 - j, s * .52, s * .08 + j);
        c.fillStyle = '#fff'; for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(cx - s * .24 + i * s * .11, cy - s * .08); c.lineTo(cx - s * .19 + i * s * .11, cy - s * .16); c.lineTo(cx - s * .14 + i * s * .11, cy - s * .08); c.fill(); }
        eyes(c, cx, cy - s * .26 - j, s, ex, ey, .1, .045, '#ffe08a', '#a01010');
      }
      break;
    case 'bird': {
      const f = Math.sin(t * 12), hov = Math.sin(t * 3) * s * .05;
      c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(cx, cy + s * .32, s * .18, s * .05, 0, 0, 7); c.fill();
      c.fillStyle = mix(d.col, '#000000', .2);
      for (const k of [-1, 1]) { c.beginPath(); c.ellipse(cx + k * s * .2, cy - s * .02 + hov, s * .16, s * .06 + f * s * .04, k * .4, 0, 7); c.fill(); }
      circ(c, cx, cy + hov, s * .17, col);
      c.fillStyle = '#f2a03a'; c.beginPath(); c.moveTo(cx - s * .04, cy + s * .02 + hov); c.lineTo(cx + s * .04, cy + s * .02 + hov); c.lineTo(cx, cy + s * .1 + hov); c.fill();
      eyes(c, cx, cy - s * .05 + hov, s, ex, ey, .06, .035);
      break;
    }
    case 'box': {
      rr(c, cx - s * .24, cy - s * .12, s * .48, s * .4, s * .05, col);
      rr(c, cx - s * .07, cy - s * .32, s * .14, s * .22, 3, '#4a2a1a'); circ(c, cx, cy - s * .34, s * .08, '#5a3a2a');
      c.fillStyle = 'rgba(255,255,255,.15)'; c.fillRect(cx - s * .24, cy + s * .2, s * .48, s * .08);
      eyes(c, cx, cy + s * .04, s, ex, ey, .09, .05);
      c.strokeStyle = '#222'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(cx - s * .15, cy - s * .04); c.lineTo(cx - s * .04, cy); c.moveTo(cx + s * .15, cy - s * .04); c.lineTo(cx + s * .04, cy); c.stroke();
      break;
    }
    case 'gear':
      cog(c, cx, cy + s * .04, s * .3, 9, t * 4, col);
      eyes(c, cx, cy + s * .04, s, ex, ey, .06, .045);
      break;
    case 'ghost': {
      const hov = Math.sin(t * 2.5) * s * .06;
      c.globalAlpha = .72;
      c.fillStyle = col; c.beginPath(); c.arc(cx, cy - s * .06 + hov, s * .24, Math.PI, 0);
      for (let i = 0; i <= 6; i++) { const xx = cx + s * .24 - i * s * .08; c.lineTo(xx, cy + s * .26 + hov + (i % 2 ? -s * .05 : 0) + Math.sin(t * 6 + i) * s * .02); }
      c.closePath(); c.fill();
      c.globalAlpha = 1;
      c.fillStyle = '#2a2050'; c.beginPath(); c.ellipse(cx - s * .08, cy - s * .06 + hov, s * .045, s * .07, 0, 0, 7); c.fill(); c.beginPath(); c.ellipse(cx + s * .08, cy - s * .06 + hov, s * .045, s * .07, 0, 0, 7); c.fill();
      break;
    }
    case 'wisp': {
      const hov = Math.sin(t * 4) * s * .08;
      glow(c, cx, cy + hov, s * .55, d.col);
      circ(c, cx, cy + hov, s * .14, col); circ(c, cx, cy + hov, s * .08, '#ffffff');
      eyes(c, cx, cy - s * .02 + hov, s, ex, ey, .05, .03, '#1a3a3a', '#1a3a3a');
      break;
    }
  }
  c.restore();
  if (m.hp < m.maxHp && !(m.ai === 'mimic' && !m.awake)) {
    const bw = s * .6, bx = cx - bw / 2, by = cy - s * .5;
    rr(c, bx, by, bw, 4, 2, 'rgba(0,0,0,.6)'); rr(c, bx, by, bw * clamp(m.hp / m.maxHp, 0, 1), 4, 2, m.boss ? '#ff6a5a' : '#e65a6c');
  }
  if (m.stun > 0) for (let i = 0; i < 3; i++) { const a = T * 4 + i * 2.1; circ(c, cx + Math.cos(a) * s * .22, cy - s * .42 + Math.sin(a) * s * .06, s * .035, '#ffe08a'); }
}
function drawEntities(c) {
  const list = alive().map(m => ({ y: m.vy, f: () => drawMon(c, m) }));
  if (run && p && p.hp > 0) list.push({ y: p.vy + .01, f: () => drawHero(c, (p.vx + 1.5) * TS + (p.lx || 0), (p.vy + 1.5) * TS + (p.ly || 0), TS, p.cls, 0, -1, p.invis > 0 ? .35 : 1) });
  list.sort((a, b) => a.y - b.y).forEach(e => e.f());
}
function drawShots(c) {
  shots = shots.filter(s => s.t < 1);
  for (const s of shots) {
    const [x0, y0] = cellCenter(s.x0, s.y0), [x1, y1] = cellCenter(s.x1, s.y1);
    if (s.bolt) {
      c.save(); c.globalAlpha = 1 - s.t; c.strokeStyle = s.col; c.lineWidth = 3; c.shadowColor = s.col; c.shadowBlur = 12; c.beginPath(); c.moveTo(x0, y0);
      for (let i = 1; i < 6; i++) { const k = i / 6; c.lineTo(x0 + (x1 - x0) * k + (Math.random() - .5) * TS * .4, y0 + (y1 - y0) * k + (Math.random() - .5) * TS * .4); }
      c.lineTo(x1, y1); c.stroke(); c.restore();
    } else {
      const k = Math.min(1, s.t * 1.6);
      circ(c, x0 + (x1 - x0) * k, y0 + (y1 - y0) * k - TS * .1, TS * .08, s.col);
    }
  }
}
function drawParts(c) {
  for (const q of parts) {
    const a = clamp(q.life / q.max, 0, 1);
    if (q.kind === 'puff' || q.kind === 'fog') { c.fillStyle = hexA(q.col, a * (q.kind === 'fog' ? .08 : .35)); c.beginPath(); c.arc(q.x, q.y, q.sz * (q.kind === 'puff' ? (2 - a) : 1), 0, 7); c.fill(); }
    else { c.fillStyle = hexA(q.col, a); c.fillRect(q.x - q.sz / 2, q.y - q.sz / 2, q.sz, q.sz); }
  }
}
function drawLight(c, th) {
  const gw = (W + 2) * TS, gh = (H + 2) * TS;
  c.save(); c.globalCompositeOperation = 'lighter';
  for (let y = 1; y < H; y += 3) {
    const lx = (MID + 1.5) * TS, ly = (y + 1.5) * TS, fl = .9 + Math.sin(T * 2.3 + y) * .06 + (wg.thId === 'ghost' ? Math.random() * .2 : 0);
    const g = c.createRadialGradient(lx, ly, 0, lx, ly, TS * 3.2);
    g.addColorStop(0, hexA(th.light, .2 * fl)); g.addColorStop(1, hexA(th.light, 0));
    c.fillStyle = g; c.fillRect(lx - TS * 3.2, ly - TS * 3.2, TS * 6.4, TS * 6.4);
  }
  c.restore();
  const px = run && p ? (p.vx + 1.5) * TS : gw / 2, py = run && p ? (p.vy + 1.5) * TS : gh / 2;
  const g = c.createRadialGradient(px, py, TS * 1.3, px, py, TS * (th.dark > .5 ? 5.5 : 8.5));
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(3,3,9,${th.dark})`);
  c.fillStyle = g; c.fillRect(0, 0, gw, gh);
}
function drawFloaters(c) {
  c.textAlign = 'center';
  for (const f of floaters) {
    if (f.t < 0) continue;
    const a = clamp(1 - f.t / 1.1, 0, 1);
    c.font = `700 ${Math.round(TS * .36 * f.scale)}px system-ui,sans-serif`;
    c.fillStyle = `rgba(0,0,0,${a * .7})`; c.fillText(f.txt, f.x + 1, f.y - f.t * TS * .8 + 1);
    c.fillStyle = f.col; c.globalAlpha = a; c.fillText(f.txt, f.x, f.y - f.t * TS * .8); c.globalAlpha = 1;
  }
}
function render() {
  const c = ctx;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = '#07080d'; c.fillRect(0, 0, CW, CH);
  if (!wg) return;
  const th = wg.th;
  const sway = Math.sin(T * 1.7) * .7 + Math.sin(T * .43) * .5;
  const shx = (Math.random() - .5) * fx.shake * 7, shy = (Math.random() - .5) * fx.shake * 7;
  c.save(); c.translate(OX + sway + shx, OY + shy);
  c.drawImage(stat, 0, 0, (W + 2) * TS, (H + 2) * TS);
  drawWindows(c, th); drawDoor(c, th); drawTraps(c); drawTele(c); drawObjs(c); drawEntities(c);
  drawShots(c); drawParts(c); drawLight(c, th); drawFloaters(c);
  c.restore();
  if (fx.flash > 0) { c.fillStyle = `rgba(220,50,70,${fx.flash * .3})`; c.fillRect(0, 0, CW, CH); }
  if (fx.banner && fx.banner.t < 2.6) {
    const b = fx.banner, a = clamp(Math.min(b.t / .3, (2.6 - b.t) / .5), 0, 1);
    c.globalAlpha = a; c.textAlign = 'center';
    const y = OY + TS * 4.2;
    c.fillStyle = 'rgba(8,8,14,.7)'; rr(c, CW / 2 - TS * 3, y - TS * .9, TS * 6, TS * 1.55, 12); c.fill();
    c.fillStyle = '#ffe2a8'; c.font = `700 ${Math.round(TS * .5)}px Georgia,serif`; c.fillText(b.a, CW / 2, y - TS * .2);
    c.fillStyle = '#c9c3d8'; c.font = `${Math.round(TS * .32)}px system-ui,sans-serif`; c.fillText(b.b, CW / 2, y + TS * .32);
    c.globalAlpha = 1;
  }
  if (fx.fade > 0) { c.fillStyle = `rgba(5,5,9,${fx.fade})`; c.fillRect(0, 0, CW, CH); }
}

function ambient(dt) {
  const th = wg.th, gw = (W + 2) * TS, s = TS;
  const spawn = (q) => parts.length < 160 && parts.push(q);
  const rx = () => s + Math.random() * W * s, ry = () => s + Math.random() * H * s;
  const rate = { dust: 3, steam: 4, leaf: 2, snow: 14, feather: 1.2, confetti: 6, spark: 4, fog: 2 }[th.amb] || 0;
  if (Math.random() > rate * dt) return;
  switch (th.amb) {
    case 'dust': spawn({ x: rx(), y: ry(), vx: (Math.random() - .5) * 6, vy: -3 - Math.random() * 4, life: 4, max: 4, col: '#fff2d0', sz: 1.5 }); break;
    case 'steam': {
      const tabs = []; for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (wg.tiles[y][x] && (wg.tiles[y][x].k === 'table' || wg.tiles[y][x].k === 'samovar')) tabs.push([x, y]);
      if (tabs.length) { const [x, y] = rpick(tabs); spawn({ x: (x + 1.5) * s, y: (y + 1.3) * s, vx: (Math.random() - .5) * 5, vy: -12, life: 1.6, max: 1.6, col: '#ffffff', sz: s * .1, kind: 'puff' }); }
      break;
    }
    case 'leaf': spawn({ x: rx(), y: s, vx: (Math.random() - .5) * 10, vy: 14, life: 6, max: 6, col: '#6fc86a', sz: 3 }); break;
    case 'snow': spawn({ x: rx(), y: s, vx: (Math.random() - .5) * 8, vy: 26 + Math.random() * 20, life: 6, max: 6, col: '#ffffff', sz: 2 }); break;
    case 'feather': spawn({ x: rx(), y: s, vx: (Math.random() - .5) * 12, vy: 10, life: 7, max: 7, col: '#e8e8f0', sz: 3 }); break;
    case 'confetti': spawn({ x: rx(), y: s, vx: (Math.random() - .5) * 20, vy: 30, life: 5, max: 5, col: rpick(['#f25a7a', '#f2c14a', '#5ab4f2', '#72d48f']), sz: 3 }); break;
    case 'spark': spawn({ x: rx(), y: ry(), vx: (Math.random() - .5) * 40, vy: -30, life: .6, max: .6, col: '#ffcf6a', sz: 2, g: 90 }); break;
    case 'fog': spawn({ x: Math.random() * gw, y: ry(), vx: 6 + Math.random() * 6, vy: 0, life: 7, max: 7, col: '#b8a8ff', sz: s * (1 + Math.random()), kind: 'fog' }); break;
  }
}
let last = performance.now(); let T = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  if (wg) {
    const k = Math.min(1, dt * 16);
    if (p) { p.vx += (p.x - p.vx) * k; p.vy += (p.y - p.vy) * k; p.lx = (p.lx || 0) * Math.max(0, 1 - dt * 12); p.ly = (p.ly || 0) * Math.max(0, 1 - dt * 12); }
    for (const m of wg.mons) { m.vx += (m.x - m.vx) * k; m.vy += (m.y - m.vy) * k; m.lx *= Math.max(0, 1 - dt * 12); m.ly *= Math.max(0, 1 - dt * 12); if (m.flash > 0) m.flash -= dt; }
    for (const q of parts) { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.g) q.vy += q.g * dt; }
    parts = parts.filter(q => q.life > 0);
    for (const f of floaters) f.t += dt;
    floaters = floaters.filter(f => f.t < 1.1);
    for (const s of shots) s.t += dt * 3;
    fx.shake = Math.max(0, fx.shake - dt * 2.5); fx.flash = Math.max(0, fx.flash - dt * 2);
    fx.fade += (fx.fadeTo - fx.fade) * Math.min(1, dt * 9);
    if (fx.banner) fx.banner.t += dt;
    ambient(dt);
  }
  if (dirty) hud();
  render();
  requestAnimationFrame(frame);
}

// ====================== Управление ======================
let walk = null;
function stopWalk() { if (walk) { clearTimeout(walk); walk = null; } }
function pathTo(tx, ty) {
  // ищем путь к клетке или к соседней с целью, если на ней враг или загораживающий предмет
  const goalIsSolid = (inside(tx, ty) && (monAt(tx, ty) || blockObj(tx, ty))) || (tx === MID && ty === -1);
  const goals = goalIsSolid ? DIRS.map(([dx, dy]) => [tx + dx, ty + dy]).filter(([x, y]) => inside(x, y)) : [[tx, ty]];
  const prev = new Map([[K(p.x, p.y), null]]), q = [[p.x, p.y]];
  while (q.length) {
    const [x, y] = q.shift();
    if (goals.some(([gx, gy]) => gx === x && gy === y)) {
      const path = []; let k = K(x, y);
      while (prev.get(k)) { path.unshift(k.split(',').map(Number)); k = prev.get(k); }
      if (goalIsSolid) path.push([tx, ty]);
      return path;
    }
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy, nk = K(nx, ny);
      if (!inside(nx, ny) || prev.has(nk) || wg.tiles[ny][nx] || blockObj(nx, ny) || monAt(nx, ny)) continue;
      const tr = wg.traps.get(nk); if (tr && (!tr.hidden || tr.t === 'vent') && !(nx === tx && ny === ty)) continue;  // обходим видимые ловушки
      prev.set(nk, K(x, y)); q.push([nx, ny]);
    }
  }
  return null;
}
function tapCell(gx, gy) {
  if (!canAct()) return;
  stopWalk();
  if (gx === p.x && gy === p.y) return;
  const path = pathTo(gx, gy);
  if (!path || !path.length) { toast('Туда не пройти.', 1200); return; }
  let hp = p.hp;
  const step = () => {
    walk = null;
    if (!path.length || !canAct()) return;
    const [nx, ny] = path.shift();
    const dangerous = alive().some(m => m.awake && dist(m, p) <= 1);
    const moved = act(nx - p.x, ny - p.y);
    if (!moved || p.hp < hp || dangerous || modalOpen()) return;
    hp = p.hp;
    if (path.length) walk = setTimeout(step, 130);
  };
  step();
}
// касания по полю: свайп — шаг, тап — идти к клетке
let tStart = null;
cv.addEventListener('pointerdown', e => { audio(); tStart = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerup', e => {
  if (!tStart || !run) return;
  const dx = e.clientX - tStart.x, dy = e.clientY - tStart.y; tStart = null;
  if (Math.hypot(dx, dy) > 24) { stopWalk(); if (Math.abs(dx) > Math.abs(dy)) act(Math.sign(dx), 0); else act(0, Math.sign(dy)); return; }
  const r = cv.getBoundingClientRect();
  const gx = Math.floor((e.clientX - r.left - OX) / TS) - 1, gy = Math.floor((e.clientY - r.top - OY) / TS) - 1;
  if (gx === MID && gy === -1) { if (p.x === MID && p.y === 0) return act(0, -1); return tapCell(gx, gy); }
  if (inside(gx, gy)) tapCell(gx, gy);
});
// кнопки: зажатая стрелка повторяет шаг
let holdT = null;
document.querySelectorAll('#dpad button').forEach(b => {
  const [dx, dy] = b.dataset.d.split(',').map(Number);
  const go = () => { stopWalk(); act(dx, dy); };
  b.addEventListener('pointerdown', e => { e.preventDefault(); audio(); go(); clearInterval(holdT); if (dx || dy) holdT = setInterval(go, 190); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => clearInterval(holdT)));
});
$('bAbility').onclick = () => { stopWalk(); ability(); };
$('bBag').onclick = () => { if (canAct()) { stopWalk(); queueModal(bagModal()); } };
$('bMenu').onclick = () => { if (canAct()) { stopWalk(); queueModal(menuModal()); } };
document.addEventListener('keydown', e => {
  const map = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0], Space: [0, 0], Period: [0, 0] };
  if (e.code === 'Escape' && curModal && curModal.buttons && curModal.buttons.length) { nextModal(); return; }
  if (!run || screenOpen()) return;
  if (map[e.code]) { e.preventDefault(); stopWalk(); act(...map[e.code]); }
  else if (e.code === 'KeyE' || e.code === 'KeyQ') ability();
  else if (e.code === 'KeyI' || e.code === 'KeyB') $('bBag').onclick();
});

// ====================== Запуск ======================
function start() {
  setupTelegram();
  new ResizeObserver(resize).observe($('stage'));
  resize();
  if (tg) tg.onEvent('viewportChanged', resize);
  loadAll(() => { showTitle(); hud(); });
  requestAnimationFrame(frame);
}
start();
</script>
